model:
  name: tiny_unet
  base_channels: 8
  num_classes: 4
  class_names:
  - background_ui
  - valid_fov_tissue
  - black_corner
  - popup_overlay
  input_width: 512
  input_height: 384
  resize_mode: letterbox
training:
  batch_size: 8
  epochs: 60
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: ReduceLROnPlateau
  scheduler_patience: 3
  scheduler_factor: 0.5
  early_stopping_patience: 12
  checkpoint_every_n_epochs: 5
  seed: 27182818
  num_workers: 4
  matched_popup_batching: true
loss:
  cross_entropy_weight: 1.0
  dice_weight: 1.0
  class_weights:
  - 1.0
  - 1.0
  - 2.5
  - 4.0
augmentation:
  train: true
